# dsh-plugin-codex-link 的 bundle 补丁层：只插入本插件自己的一行。
#
# 注意：patch 对 config 是整块替换（不是深合并）。profile 层若要覆盖这里的
# 某个键，必须把想保留的键全部重写。
#
# 默认交互工作区固定为 Codex 的 Wechat 项目；默认会话名与 Codex 桌面端里
# 已有的「微信工作区（DSH）」保持一致，首次使用会自动定位，找不到才新建。
- insert:
    - id: dsh-plugin-codex-link
      name: dsh-plugin-codex-link
      config:
        enabled: true
        workspaceRoot: 'C:\Users\Bolin\Desktop\DSH\Wechat'
        defaultThreadName: '微信工作区（DSH）'
        codexPath: null
        sandbox: workspace-write
        approvalPolicy: never
        networkAccess: false
        approvals: deny
        startupTimeoutMs: 20000
        requestTimeoutMs: 600000
        watchDefaultWaitMs: 8000
        watchMaxWaitMs: 20000
        eventBufferLimit: 2000
        summaryChars: 500
        fullChars: 4000
        focusMode: off

# dsh-plugin-codex-link 的 bundle 补丁层：只插入本插件自己的一行。
#
# 注意：patch 对 config 是整块替换（不是深合并）。profile 层若要覆盖这里的
# 某个键，必须把想保留的键全部重写。
#
# 工作区留空表示自动：当前 DSH 会话目录 → 用户主目录；也可以在
# 设置 → Codex 联动 里选择工作区（保存到 ui.json，优先于自动值）。
# 默认会话名为通用名，首次使用在工作区里定位，找不到才新建。
- insert:
    - id: dsh-plugin-codex-link
      name: dsh-plugin-codex-link
      config:
        enabled: true
        workspaceRoot: ''
        defaultThreadName: 'DSH 工作区'
        codexPath: null
        sandbox: workspace-write
        approvalPolicy: never
        networkAccess: false
        approvals: deny
        startupTimeoutMs: 20000
        requestTimeoutMs: 600000
        watchDefaultWaitMs: 8000
        watchMaxWaitMs: 20000
        eventBufferLimit: 2000
        summaryChars: 500
        fullChars: 4000
        focusMode: off
        mode: hybrid
        maxParallelTasks: 2
        queueFallback: true
